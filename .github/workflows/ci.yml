name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.1
  # Keep in step with .cargo/config.toml and scripts/opentui-native.sh.
  OPENTUI_VERSION: 0.9.9

jobs:
  # Decides which checks a change needs, so a docs-only change skips the macOS build. A run with no base to compare
  # (a manual run, a new branch, a force push) checks everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect the changed areas
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          # The Rust job's inputs: the code, the vendored grammar sources, the build script, the build and toolchain
          # files, the just tasks, and the Markdown files the tests read (palettes, key list). This file runs both jobs.
          RUST: '^(src/|tests/|vendor/|\.cargo/|scripts/|build\.rs$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|rustfmt\.toml$|justfile$|deny\.toml$|about\.(toml|hbs)$|DESIGN\.md$|docs/keymaps\.md$|\.github/workflows/ci\.yml$)'
          MARKDOWN: '(\.md$|^\.github/workflows/ci\.yml$)'
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            printf 'rust=true\nmarkdown=true\n' >> "$GITHUB_OUTPUT"
            echo "No base to compare; every check runs."
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          printf '%s\n' "$files"
          for area in rust markdown; do
            pattern=$(printenv "$(echo "$area" | tr '[:lower:]' '[:upper:]')")
            if printf '%s\n' "$files" | grep -qE "$pattern"; then hit=true; else hit=false; fi
            echo "$area=$hit" | tee -a "$GITHUB_OUTPUT"
          done

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # fmc supports macOS on Apple silicon only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: v2.4.0
          # The action's default is a sticky PR comment, which needs write access this job does not have.
          pr-comment: false

      # kache-action only warns when its download fails; fail here instead of building uncached.
      - name: Check kache
        run: kache --version

      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: just,cargo-deny

      - name: Restore the OpenTUI native library
        id: native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fmc/opentui-native/${{ env.OPENTUI_VERSION }}
          key: opentui-native-${{ env.OPENTUI_VERSION }}-zig${{ env.ZIG_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/opentui-native.sh') }}

      # Zig is needed only to build the library on a cache miss (`just verify` runs scripts/opentui-native.sh).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.native.outputs.cache-hit != 'true'
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Verify
        run: just verify

  markdown:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same check as `just format-check`; pinned so a rumdl release cannot change the result.
      - name: Check the Markdown format
        run: pipx run rumdl==0.2.60 fmt --check --quiet .

  # One status for branch protection: green when every needed check passed or was skipped as not needed.
  ci:
    needs: [changes, rust, markdown]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
