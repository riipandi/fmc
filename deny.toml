# License gate: `cargo deny check licenses`. A dependency under any other licence fails the gate.
[graph]
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# opentui-sys declares `MIT AND LGPL-2.1-or-later` because the upstream release library embeds FFmpeg. fmc links a native
# library built with `-Dvideo=false` (scripts/opentui-native.sh), which has no FFmpeg code.
# This exception is valid only while that holds.
[[licenses.exceptions]]
crate = "opentui-sys"
allow = ["LGPL-2.1-or-later"]
