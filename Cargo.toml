[package]
name = "fmc"
version = "0.6.0"
edition = "2024"
description = "A terminal file browser with Markdown, code, image, and git diff views"
license = "MIT OR Apache-2.0"
repository = "https://github.com/riipandi/fmc"
readme = "README.md"
rust-version = "1.92"
keywords = ["tui", "terminal", "file-manager", "git", "markdown"]
categories = ["command-line-utilities"]

[dependencies]
# Both pinned exactly: the native library in .cache/opentui-native must match the -sys header.
opentui = { version = "=0.9.9", features = ["tree-sitter"] }
opentui-sys = "=0.9.9"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage"] }
icu_collator = "2.4"
imagesize = "0.15"
mermaid-text = "=0.58.0"
unicode-width = "0.2.3"
neo_frizbee = "=0.13.3"
tree-sitter-json = "=0.24.8"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-c = "=0.24.2"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-md = "=0.5.4"
tree-sitter-zig = "=1.1.2"
tree-sitter-diff = "=0.1.0"
tree-sitter-elixir = "=0.3.5"
tree-sitter-heex = "=0.8.1"
tree-sitter-hcl = "=1.1.0"
tree-sitter-jsdoc = "=0.25.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-regex = "=0.25.0"
tree-sitter-sequel = "=0.3.13"
tree-sitter-svelte-ng = "=1.0.2"
tree-sitter-xml = "=0.7.0"
tree-sitter-astro-next = "=0.1.1"
tree-sitter-vim = "=0.4.0"
tree-sitter-tsquery = "=0.8.0"
tree-sitter-json5-orchard = "=0.1.1"
trash = "=5.4.0"
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3.27"

[build-dependencies]
cc = "=1.11.3"
