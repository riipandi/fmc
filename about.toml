# Third-party notices: `cargo about generate about.hbs -o target/THIRD_PARTY_LICENSES.html`.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# opentui-sys declares `MIT AND LGPL-2.1-or-later` because upstream's prebuilt library embeds FFmpeg. fmc links a
# library built with video off (scripts/opentui-native.sh, deny.toml's exception), so the notices are the crate's own
# MIT licence and those of the code the macOS archive carries (Yoga, Zig's runtime, zlib).
[opentui-sys.clarify]
license = "MIT AND Zlib"

[[opentui-sys.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "d9c397a5dc5ac77a2a08fc967ea06a65317a4b5b8de48f6f732ffcb21737e3d2"

[[opentui-sys.clarify.files]]
path = "LICENSE-YOGA"
